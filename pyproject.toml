[project]
name = "screen-assistant"
version = "0.1.0"
description = "Lightweight Windows screen assistant for presentations and teaching."
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6==6.8.3",
]

[project.optional-dependencies]
capture = [
    "mss>=9.0",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
