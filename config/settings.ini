[app]
language = ko
start_minimized = false

[storage]
mode = portable

[overlay]
enabled = true
click_through = true
opacity = 1.0

[click_indicator]
enabled = true
use_images = true
image_directory = resources/click_indicators
show_left = true
show_right = true
show_both = true
show_double = true
show_wheel = true
show_wheel_drag = true
radius = 30
pressed_radius = 34
image_size = 36
image_gap = 10
duration_ms = 220
fade_ms = 360
width = 3
left_color = #ff3b30
right_color = #0a84ff
both_color = #bf5af2
middle_color = #34c759
wheel_color = #ffcc00
outline_color = #1c1c1e
show_text = false

[drawing]
enabled = true
default_tool = freehand
pass_through_on_start = true
show_click_effects_while_drawing = false
confirm_clear_all = false
undo_limit = 100
color = #00a6ff
width = 4
line_style = solid
opacity = 255
smoothing = true
toolbar_button_size = 28
toolbar_x = 20
toolbar_y = 80

[highlighter]
color = #ffff00
width = 24
opacity = 90
snap_horizontal = false

[eraser]
mode = object
size = 24

[capture]
enabled = true
default_mode = region
include_annotations = true
include_click_effects = false
include_cursor = false
copy_to_clipboard = true
auto_save = false
open_pinned_window = false
image_format = PNG
jpeg_quality = 90
save_directory = captures
filename_pattern = ScreenAidStudio_{date}_{time}
show_notification = true
remember_last_region = true

[notification]
enabled = true
capture_completed = true
capture_failed = true
hotkey_failed = true
pin_failed = true
live_failed = true
drawing_mode_changed = true
pause_changed = true
command_blocked = true
click_effects_changed = true
manual_failed = true

[pinned_window]
enabled = true
default_zoom = 1.0
min_zoom = 0.25
max_zoom = 4.0
click_through = false

[live_view]
enabled = true
default_fps = 10
min_fps = 1
max_fps = 30
max_queue_size = 1

[startup]
enabled = false

[hotkeys]
command_mode = Ctrl+Alt+A
toggle_click_effects = Ctrl+Alt+E

[command_mode]
enabled = true
show_hint = true
timeout_ms = 5000
toggle_overlay = O
toggle_click_effects = E
toggle_drawing = D
pass_through = P
clear_drawing = C
undo_drawing = Z
redo_drawing = Y
capture_region = R
capture_last_region = L
save_last_capture = I
capture_monitor = M
capture_virtual = V
capture_window = W
pin_region = K
pin_last_capture = B
live_region = G
live_stop_all = X
fullscreen_magnifier = F
live_magnifier = J
open_settings = S
toggle_pause = Space

[region_selection]
dark_overlay_opacity = 110
border_width = 2
show_size = true
show_coordinates = false
minimum_width = 4
minimum_height = 4

[magnifier]
enabled = true
scale = 2.0
size = 260
keep_drawings_on_close = false
live_scale = 2.0
